<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKR Squad</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #2e0854;
            color: white;
            text-align: center;
        }

        h1{
            color: gold;
            margin-top: 20px;
        }

        .team{
            width: 60%;
            margin: auto;
            background: #4b0082;
            padding: 20px;
            border-radius: 10px;
        }

        ul{
            list-style-type: none;
            padding: 0;
        }

        li{
            background: #7b1fa2;
            margin: 10px;
            padding: 12px;
            border-radius: 5px;
            font-size: 18px;
        }

        li:hover{
            background: gold;
            color: black;
        }
    </style>
</head>

<body>

    <h1>Kolkata Knight Riders Squad</h1>

    <div class="team">
        <ul>
            <li>Shreyas Iyer</li>
            <li>Andre Russell</li>
            <li>Sunil Narine</li>
            <li>Rinku Singh</li>
            <li>Phil Salt</li>
            <li>Venkatesh Iyer</li>
            <li>Mitchell Starc</li>
            <li>Varun Chakravarthy</li>
            <li>Harshit Rana</li>
            <li>Rahmanullah Gurbaz</li>
            <li>Nitish Rana</li>
            <li>Suyash Sharma</li>
            <li>Manish Pandey</li>
            <li>Ramandeep Singh</li>
        </ul>
    </div>

</body>
</html>
