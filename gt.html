<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GT Squad</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #102542;
            color: white;
            text-align: center;
        }

        h1{
            color: gold;
            margin-top: 20px;
        }

        .team{
            width: 60%;
            margin: auto;
            background: #1c3d73;
            padding: 20px;
            border-radius: 10px;
        }

        ul{
            list-style-type: none;
            padding: 0;
        }

        li{
            background: #4f83cc;
            margin: 10px;
            padding: 12px;
            border-radius: 5px;
            font-size: 18px;
        }

        li:hover{
            background: gold;
            color: black;
        }
    </style>
</head>

<body>

    <h1>Gujarat Titans Squad</h1>

    <div class="team">
        <ul>
            <li>Shubman Gill</li>
            <li>Rashid Khan</li>
            <li>David Miller</li>
            <li>Sai Sudharsan</li>
            <li>Wriddhiman Saha</li>
            <li>Rahul Tewatia</li>
            <li>Mohit Sharma</li>
            <li>Noor Ahmad</li>
            <li>Spencer Johnson</li>
            <li>Vijay Shankar</li>
            <li>Kane Williamson</li>
            <li>Azmatullah Omarzai</li>
            <li>Matthew Wade</li>
            <li>Shahrukh Khan</li>
        </ul>
    </div>

</body>
</html>
