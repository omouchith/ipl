<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBKS Squad</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #8b0000;
            color: white;
            text-align: center;
        }

        h1{
            color: #ffcccb;
            margin-top: 20px;
        }

        .team{
            width: 60%;
            margin: auto;
            background: #c62828;
            padding: 20px;
            border-radius: 10px;
        }

        ul{
            list-style-type: none;
            padding: 0;
        }

        li{
            background: #ef9a9a;
            margin: 10px;
            padding: 12px;
            border-radius: 5px;
            font-size: 18px;
            color: black;
        }

        li:hover{
            background: white;
            color: #c62828;
        }
    </style>
</head>

<body>

    <h1>Punjab Kings Squad</h1>

    <div class="team">
        <ul>
            <li>Shikhar Dhawan</li>
            <li>Sam Curran</li>
            <li>Arshdeep Singh</li>
            <li>Liam Livingstone</li>
            <li>Jitesh Sharma</li>
            <li>Kagiso Rabada</li>
            <li>Harshal Patel</li>
            <li>Rahul Chahar</li>
            <li>Jonny Bairstow</li>
            <li>Prabhsimran Singh</li>
            <li>Rilee Rossouw</li>
            <li>Shashank Singh</li>
            <li>Ashutosh Sharma</li>
            <li>Harpreet Brar</li>
        </ul>
    </div>

</body>
</html>
