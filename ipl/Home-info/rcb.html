<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCB Squad</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #6f1414;
            color: white;
            text-align: center;
        }

        h1{
            color: gold;
            margin-top: 20px;
        }

        .team{
            width: 60%;
            margin: auto;
            background: #b30000;
            padding: 20px;
            border-radius: 10px;
        }

        ul{
            list-style-type: none;
            padding: 0;
        }

        li{
            background: goldenrod;
            margin: 10px;
            padding: 12px;
            border-radius: 5px;
            font-size: 18px;
        }

        li:hover{
            background: gold;
            color: black;
        }
    </style>
</head>

<body>

    <h1>Royal Challengers Bengaluru Squad</h1>

    <div class="team">
        <ul>
            <li>Virat Kohli</li>
            <li>Faf du Plessis</li>
            <li>Glenn Maxwell</li>
            <li>Rajat Patidar</li>
            <li>Dinesh Karthik</li>
            <li>Cameron Green</li>
            <li>Mohammed Siraj</li>
            <li>Yash Dayal</li>
            <li>Lockie Ferguson</li>
            <li>Karn Sharma</li>
            <li>Anuj Rawat</li>
            <li>Mahipal Lomror</li>
            <li>Swapnil Singh</li>
            <li>Suyash Prabhudessai</li>
        </ul>
    </div>

</body>
</html>
