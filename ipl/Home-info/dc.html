<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DC Squad</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #0d47a1;
            color: white;
            text-align: center;
        }

        h1{
            color: #ff5252;
            margin-top: 20px;
        }

        .team{
            width: 60%;
            margin: auto;
            background: #1565c0;
            padding: 20px;
            border-radius: 10px;
        }

        ul{
            list-style-type: none;
            padding: 0;
        }

        li{
            background: #64b5f6;
            margin: 10px;
            padding: 12px;
            border-radius: 5px;
            font-size: 18px;
            color: black;
        }

        li:hover{
            background: #ff5252;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Delhi Capitals Squad</h1>

    <div class="team">
        <ul>
            <li>Rishabh Pant</li>
            <li>David Warner</li>
            <li>Prithvi Shaw</li>
            <li>Jake Fraser-McGurk</li>
            <li>Axar Patel</li>
            <li>Kuldeep Yadav</li>
            <li>Mitchell Marsh</li>
            <li>Khaleel Ahmed</li>
            <li>Anrich Nortje</li>
            <li>Ishant Sharma</li>
            <li>Tristan Stubbs</li>
            <li>Lalit Yadav</li>
            <li>Abishek Porel</li>
            <li>Mukesh Kumar</li>
        </ul>
    </div>

</body>
</html>
