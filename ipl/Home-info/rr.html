<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RR Squad</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #ffb6c1;
            color: white;
            text-align: center;
        }

        h1{
            color: #880e4f;
            margin-top: 20px;
        }

        .team{
            width: 60%;
            margin: auto;
            background: #e91e63;
            padding: 20px;
            border-radius: 10px;
        }

        ul{
            list-style-type: none;
            padding: 0;
        }

        li{
            background: #f48fb1;
            margin: 10px;
            padding: 12px;
            border-radius: 5px;
            font-size: 18px;
            color: black;
        }

        li:hover{
            background: white;
            color: black;
        }
    </style>
</head>

<body>

    <h1>Rajasthan Royals Squad</h1>

    <div class="team">
        <ul>
            <li>Sanju Samson</li>
            <li>Jos Buttler</li>
            <li>Yashasvi Jaiswal</li>
            <li>Riyan Parag</li>
            <li>Shimron Hetmyer</li>
            <li>Dhruv Jurel</li>
            <li>R Ashwin</li>
            <li>Yuzvendra Chahal</li>
            <li>Trent Boult</li>
            <li>Avesh Khan</li>
            <li>Sandeep Sharma</li>
            <li>Rovman Powell</li>
            <li>Nandre Burger</li>
            <li>Tom Kohler-Cadmore</li>
        </ul>
    </div>

</body>
</html>
