<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSG Squad</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #81d4fa;
            color: white;
            text-align: center;
        }

        h1{
            color: #01579b;
            margin-top: 20px;
        }

        .team{
            width: 60%;
            margin: auto;
            background: #29b6f6;
            padding: 20px;
            border-radius: 10px;
        }

        ul{
            list-style-type: none;
            padding: 0;
        }

        li{
            background: #b3e5fc;
            margin: 10px;
            padding: 12px;
            border-radius: 5px;
            font-size: 18px;
            color: black;
        }

        li:hover{
            background: white;
            color: black;
        }
    </style>
</head>

<body>

    <h1>Lucknow Super Giants Squad</h1>

    <div class="team">
        <ul>
            <li>KL Rahul</li>
            <li>Nicholas Pooran</li>
            <li>Marcus Stoinis</li>
            <li>Quinton de Kock</li>
            <li>Ayush Badoni</li>
            <li>Krunal Pandya</li>
            <li>Deepak Hooda</li>
            <li>Ravi Bishnoi</li>
            <li>Mohsin Khan</li>
            <li>Naveen-ul-Haq</li>
            <li>Devdutt Padikkal</li>
            <li>Yash Thakur</li>
            <li>Matt Henry</li>
            <li>Ashton Turner</li>
        </ul>
    </div>

</body>
</html>
