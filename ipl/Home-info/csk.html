<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSK Squad</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #fff176;
            color: black;
            text-align: center;
        }

        h1{
            color: #ff9800;
            margin-top: 20px;
        }

        .team{
            width: 60%;
            margin: auto;
            background: #fbc02d;
            padding: 20px;
            border-radius: 10px;
        }

        ul{
            list-style-type: none;
            padding: 0;
        }

        li{
            background: #ffeb3b;
            margin: 10px;
            padding: 12px;
            border-radius: 5px;
            font-size: 18px;
        }

        li:hover{
            background: orange;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Chennai Super Kings Squad</h1>

    <div class="team">
        <ul>
            <li>MS Dhoni</li>
            <li>Ruturaj Gaikwad</li>
            <li>Ravindra Jadeja</li>
            <li>Ajinkya Rahane</li>
            <li>Shivam Dube</li>
            <li>Moeen Ali</li>
            <li>Deepak Chahar</li>
            <li>Matheesha Pathirana</li>
            <li>Tushar Deshpande</li>
            <li>Mitchell Santner</li>
            <li>Sameer Rizvi</li>
            <li>Devon Conway</li>
            <li>Daryl Mitchell</li>
            <li>Shardul Thakur</li>
        </ul>
    </div>

</body>
</html>
