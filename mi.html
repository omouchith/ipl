<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MI Squad</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #0d47a1;
            color: white;
            text-align: center;
        }

        h1{
            color: #90caf9;
            margin-top: 20px;
        }

        .team{
            width: 60%;
            margin: auto;
            background: #1565c0;
            padding: 20px;
            border-radius: 10px;
        }

        ul{
            list-style-type: none;
            padding: 0;
        }

        li{
            background: #42a5f5;
            margin: 10px;
            padding: 12px;
            border-radius: 5px;
            font-size: 18px;
        }

        li:hover{
            background: #90caf9;
            color: black;
        }
    </style>
</head>

<body>

    <h1>Mumbai Indians Squad</h1>

    <div class="team">
        <ul>
            <li>Rohit Sharma</li>
            <li>Hardik Pandya</li>
            <li>Suryakumar Yadav</li>
            <li>Jasprit Bumrah</li>
            <li>Ishan Kishan</li>
            <li>Tilak Varma</li>
            <li>Tim David</li>
            <li>Gerald Coetzee</li>
            <li>Piyush Chawla</li>
            <li>Romario Shepherd</li>
            <li>Nehal Wadhera</li>
            <li>Akash Madhwal</li>
            <li>Nuwan Thushara</li>
            <li>Dewald Brevis</li>
        </ul>
    </div>

</body>
</html>
