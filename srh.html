<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRH Squad</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #e6491a;
            color: white;
            text-align: center;
        }

        h1{
            color: black;
            margin-top: 20px;
        }

        .team{
            width: 60%;
            margin: auto;
            background: #ec8363;
            padding: 20px;
            border-radius: 10px;
        }

        ul{
            list-style-type: none;
            padding: 0;
        }

        li{
            background: #ce522c;
            margin: 10px;
            padding: 12px;
            border-radius: 5px;
            font-size: 18px;
            color: black;
        }

        li:hover{
            background: white;
            color: black;
        }
    </style>
</head>

<body>

    <h1>Sunrisers Hyderabad Squad</h1>

    <div class="team">
        <ul>
            <li>Pat Cummins</li>
            <li>Travis Head</li>
            <li>Abhishek Sharma</li>
            <li>Heinrich Klaasen</li>
            <li>Aiden Markram</li>
            <li>Rahul Tripathi</li>
            <li>Nitish Kumar Reddy</li>
            <li>Bhuvneshwar Kumar</li>
            <li>T Natarajan</li>
            <li>Marco Jansen</li>
            <li>Mayank Agarwal</li>
            <li>Washington Sundar</li>
            <li>Glenn Phillips</li>
            <li>Umran Malik</li>
        </ul>
    </div>

</body>
</html>
